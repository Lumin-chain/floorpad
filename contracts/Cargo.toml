[workspace]
resolver = "3"
members = ["meme-token", "launchpad"]

[workspace.package]
rust-version = "1.86"

[workspace.dependencies]
near-sdk = "=5.26.1"
near-contract-standards = "=5.26.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = "symbols"
panic = "abort"
overflow-checks = true
