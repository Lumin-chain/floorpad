[package]
name = "floorpad-launchpad"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true, features = ["global-contracts"] }
near-contract-standards = { workspace = true }
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing", "global-contracts"] }
